<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Cafena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#010103;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:#2a2a2a;
    padding:40px;
    border-radius:15px;
}

h1{
    color:#bd5a19;
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    background:#bd5a19;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#d3ad7f;
}

p{
    color:white;
    text-align:center;
    margin-top:15px;
}

a{
    color:#bd5a19;
}
</style>
</head>
<body>

<div class="container">

    <h1>Cadastro</h1>

    <input type="text" placeholder="Nome Completo">

    <input type="email" placeholder="E-mail">

    <input type="password" placeholder="Senha">

    <input type="password" placeholder="Confirmar Senha">

    <button>Cadastrar</button>

    <p>
        Já possui conta?
        <a href="login.html">Entrar</a>
    </p>

</div>

</body>
</html>
